# Laboratory node configuration for the ech0/WuKongIM reference comparison.
# Derived from docker/conf/node3.toml; the only differences are the log
# directory on its own bind mount, external addresses the launcher overrides
# per node port, and no Prometheus query URL or channel debug match.
[node]
id = 3
data_dir = "/var/lib/wukongim"

[cluster]
listen_addr = "0.0.0.0:7000"
hash_slot_count = 256
# Applied only during first initialization; existing clusters retain their persisted Slot count.
initial_slot_count = 12
slot_replica_n = 3
slot_tick_interval = "50ms"
slot_heartbeat_tick = 2
slot_election_tick = 40
channel_append_batch_max_records = 128
channel_append_batch_max_wait = "250us"
commit_coordinator_flush_window = "1ms"
commit_coordinator_max_requests = 0
commit_coordinator_max_records = 0
commit_coordinator_max_bytes = 131072
commit_coordinator_shards = 1

[[cluster.nodes]]
id = 1
addr = "wk-node1:7000"

[[cluster.nodes]]
id = 2
addr = "wk-node2:7000"

[[cluster.nodes]]
id = 3
addr = "wk-node3:7000"

[channel_migration]
scan_interval = "30s"

[api]
listen_addr = "0.0.0.0:5001"
external_tcp_addr = "127.0.0.1:5100"
external_ws_addr = "ws://127.0.0.1:5200"

[bench]
api_enable = true
api_max_batch_size = 10000
api_max_payload_bytes = 10485760

[gateway]
gnet_multicore = true
gnet_num_event_loop = 4
runtime_async_send_workers = 1000
runtime_async_send_queue_capacity = 131072

[[gateway.listeners]]
name = "tcp-wkproto"
network = "tcp"
address = "0.0.0.0:5100"
transport = "gnet"
protocol = "wkproto"

[[gateway.listeners]]
name = "ws-gateway"
network = "websocket"
address = "0.0.0.0:5200"
transport = "gnet"
protocol = "wsmux"

[log]
dir = "/var/log/wukongim"
level = "info"

[plugin]
# Runtime-only Unix socket for local plugin host RPC.
# Keep it outside node.data_dir so container recreation cannot retain a stale socket.
socket_path = "/run/wukongim/plugin.sock"

[observability]
debug_api_enable = true
metrics_enable = true

[diagnostics]
enable = true

[delivery]
# Maximum recipient-authority delivery batches processed concurrently by this node.
# This is independent from channel_append.recipient_authority_dispatch_concurrency.
recipient_worker_concurrency = 320

[message]
permission_cache_ttl = "30s"
